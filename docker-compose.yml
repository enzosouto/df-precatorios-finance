services:
  postgres:
    image: postgres:16-alpine
    container_name: df-precatorios-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfprecatorios
      POSTGRES_PASSWORD: dfprecatorios
      POSTGRES_DB: df_precatorios_finance
    ports:
      - '5432:5432'
    volumes:
      - df-precatorios-finance-data:/var/lib/postgresql/data

volumes:
  df-precatorios-finance-data:
